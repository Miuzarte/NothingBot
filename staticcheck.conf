# staticcheck 配置 (作用于本目录及子目录)
#
# checks 的上游默认值是:
#   ["all", "-SA9003", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1023"]
# 这里写出同一份默认集, 再按本仓库的情况追加例外 —— 不要用 ["all", ...] 简写,
# 否则会把默认关掉的 ST 类风格检查全部打开 (实测 ST1003 会一次多出 206 条命名建议)。
checks = [
  "all",
  "-SA9003", # 空分支 (M_RssHub.go 有一处刻意的空分支)
  "-ST1000", # 包注释
  "-ST1003", # 命名风格 (userId / gId / ALL_CAPS 等, 老项目存量, 不回头改)
  "-ST1016", # 方法接收者命名一致性
  "-ST1020", # 导出函数注释形式
  "-ST1021", # 导出类型注释形式
  "-ST1022", # 导出变量注释形式
  "-ST1023", # 类型推断冗余

  # U1000 (未使用的标识符) 对整个仓库关闭
  #
  # 本仓库是「模块注册」架构: 每个 M_*.go / MO_*.go 在 init() 里 modules.Add(&moduleXxx)
  # 注册, 之后由框架按名字间接调度。staticcheck 看不到这种间接引用, 会把 35 个模块的
  # moduleXxx / initXxx / logXxx / 模块常量全部报成未使用 —— 全是误报。
  #
  # 代价是真正的死代码也不会再被报出来; 想查时临时去掉这一项, 或对具体位置用
  # `//lint:ignore U1000 原因` 单独标注。
  "-U1000",
]
