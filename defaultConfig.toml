[log]
# 控制台日志等级, 值越大输出越少
# TraceLevel = iota = 0
# DebugLevel
# InfoLevel
# WarnLevel
# ErrorLevel
# FatalLevel
# PanicLevel
# level = 0
# level = 1
level = 2
dir = '' # 本地日志存储文件夹, 留空则不存储

[global]
redisUrl = '127.0.0.1:6379' # redis
proxy = '' # http / https, 就是 os.Setenv

# bot 主配置
[onebot]
wsurl = '127.0.0.1:8081' # onebot websocket
token = ''
redisExpire = '168h' # redis 过期时间 "ns", "us" (or "µs"), "ms", "s", "m", "h"
onlineNotify = true # 上线通知
offlineNotify = true # 下线通知
superusers = [ # 超级用户 QQ 号
]
nicknames = [ # 机器人别称, 用于判断是否提到了机器人, 解决假 at
    'rurudo',
    'ruru',
]

# bot 消息过滤
[onebot.filter]
users = [ #
]
groups = [ #
]

[modules]
# PLACEHOLDER

# deepseek ai chat
[modules.deepseek]
enabled = false
apiKey = ''
whitelist.groups = [ #
]
whitelist.users = [ #
]

[modules.pixivparse]
enabled = false
accessToken = ''
refreshToken = ''
scaledLongest = 2560 # 长边缩放到指定像素
cacheDir = 'BotPixivCache' # 缓存文件夹, 重启更新
whitelist.groups = [ #
]
whitelist.users = [ #
]

[modules.ehentai]
enabled = false
saltLength = 8
maxForwardImages = 60
# maxForwardImages = 80
forwardMsgBatchSize = 20
# forwardMsgBatchSize = 16
coverShowRating = 4 # 评分大于等于此值时显示封面
cookie.ipbmemberid = ''
cookie.ipbpasshash = ''
cookie.igneous = ''
cookie.sk = '' # 不给的话搜索结果只有英文
threads = 8 # 并发线程数
useDomainFronting = false
useEnvProxy = true
useEhTagDB = true
galleryCache = true # 画廊缓存
cacheDir = 'BotEHentaiCache' # 缓存文件夹, 重启更新
whitelist.groups = [ #
]
whitelist.users = [ #
]

[modules.bilibili]
# PLACEHOLDER

# bilibili 链接解析
[modules.biliparse]
sameParseInterval = '1m' # 同一会话重复解析同一链接的间隔 "ns", "us" (or "µs"), "ms", "s", "m", "h"

# bilibili 粉丝数变动提醒
[[modules.bilirelation]]
# 岁己SUI
uid = 1954091502
target = 60000
groups = [ #
]

[modules.bilipush]
dynamicUpdateInterval = '3s' # 动态更新拉取间隔
liveMinimumInterval = '300s' # 同一直播间多次开播推送的最小间隔, 用于解决某些主播因网络问题频繁重新推流导致多次推送
# cookie = '' # 弃用, 改用扫码登录 # 通过拉取动态流进行推送, 必须设置B站cookie, 且需要关注想要推送的up

